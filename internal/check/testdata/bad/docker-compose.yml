services:
  web:
    image: nginx:latest
    privileged: true
    network_mode: host
    user: root
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    ports:
      - "5432:5432"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc:/host-etc
    environment:
      DB_PASSWORD: hunter2
