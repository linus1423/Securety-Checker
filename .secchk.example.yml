# Beispiel-Konfiguration für secchk. Kopiere sie nach .secchk.yml ins Projekt.

# Ab welchem Schweregrad der Scan mit Exit-Code 1 fehlschlägt (von --fail-on überschreibbar).
fail_on: high

ignore:
  # Regeln, die projektweit nicht gelten sollen.
  rules:
    - DF003   # Image-Digest-Pinning erzwingen wir (noch) nicht
  # Dateien/Pfade, die ignoriert werden (Globs; "dir/**" matcht den ganzen Teilbaum).
  paths:
    - "examples/**"
    - "*.test.yml"

# Akzeptierte Altlasten als Baseline: Fingerprints (siehe `--write-baseline`).
baseline: []

# Schweregrad einzelner Regeln projektweit anpassen (hoch- oder herabstufen).
# Wert muss ein gültiger Schweregrad sein (info, low, medium, high, critical).
severity_overrides:
  DF007: medium   # fehlender HEALTHCHECK ist uns wichtiger als "low"

# Dokumentierte, akzeptierte Ausnahmen – anders als "ignore" mit Begründung und
# optionalem Ablaufdatum. Nach Ablauf unterdrückt die Ausnahme nicht mehr, der
# Befund taucht wieder auf und muss erneut bewertet werden.
exceptions:
  - rule: CMP007          # Docker-Socket-Mount
    path: "legacy/**"     # optional; leer = jeder Pfad
    reason: "Alt-Service wird in Q4 migriert"
    expires: "2026-12-31" # optional; YYYY-MM-DD
